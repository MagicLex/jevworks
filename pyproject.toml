[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevworks"
version = "0.1.0"
description = "SemIf semantic-if decisions served as a Hopsworks model deployment"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "transformers==5.17.0",
  "accelerate==1.12.0",
]

[project.optional-dependencies]
deploy = ["hopsworks", "pytest"]

[tool.setuptools.packages.find]
include = ["jevworks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
